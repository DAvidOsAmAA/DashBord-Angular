<div class="flex flex-col gap-4 container mx-auto">
  <p class="text-2xl mt-3 font-semibold">Add a new category</p>
  <form [formGroup]="addCatgory" (ngSubmit)="sendData()">
    <div class="flex flex-col gap-1">
      <label for="name">Name</label>
      <input formControlName="name" type="text" id="name" pInputText />
      <error-alert
        [FormName]="addCatgory"
        controlName="name"
        errorMsg="Name is required"
        error="required"
      ></error-alert>
      <error-alert
        [FormName]="addCatgory"
        controlName="name"
        errorMsg="must be shorter than 20 character"
        error="minlength"
      ></error-alert>
      <error-alert
        [FormName]="addCatgory"
        controlName="name"
        errorMsg="must be longer than 2 character"
        error="maxlength"
      ></error-alert>
    </div>
    <div class="flex flex-col gap-1 my-5">
      <label for="image">Image</label>
      <input formControlName="image" type="file" id="image" pInputText />
      <error-alert
        [FormName]="addCatgory"
        controlName="image"
        errorMsg="Image is required"
        error="required"
      ></error-alert>
    </div>
    <p-button [disabled]="addCatgory.invalid" type="submit" label="Add Category" class="btnAddCategory" />
  </form>
</div>
